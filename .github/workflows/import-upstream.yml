name: Import upstream OpenHands source
on:
  # Automatic sync disabled to preserve mobile app additions.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clone upstream source
        run: git clone --depth 1 https://github.com/OpenHands/OpenHands.git /tmp/openhands-upstream
      - name: Copy source files
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/openhands-upstream/ ./
      - name: Commit and push source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'Import source from OpenHands/OpenHands'
            git push origin HEAD:main
          fi
